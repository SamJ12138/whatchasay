[pytest]
testpaths = tests
# Fast suite by default: no model loads, no llama-server, no network, no real Chrome.
# Slow tests: pytest -m slow
addopts = -m "not slow" -p no:cacheprovider
# a hung WebSocket receive fails the test instead of the run (slow tests set their own budget)
timeout = 60
markers =
    slow: loads real models, starts llama-server or a real browser (excluded from the fast suite)
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore:There is no current event loop:DeprecationWarning
